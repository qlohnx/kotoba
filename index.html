<!doctype html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Kotoba — японська мова</title><link rel="stylesheet" href="style.css"><script defer src="words.js"></script><script defer src="script.js"></script><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#f5f2ed"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" href="icon.svg" type="image/svg+xml"></head><body><main><header class="top-bar"><div><span class="eyebrow">日本語 · JAPANESE</span><h1>ことば <span>Kotoba</span></h1></div><button id="theme" aria-label="Змінити тему">◐</button></header><section class="panel"><div class="stats"><span>Твій прогрес</span><strong id="total"></strong></div><progress id="overall" max="100" value="0"></progress><div id="categories" class="categories"></div></section><section class="panel settings-bar"><div class="controls"><label>Режим<select id="mode"><option value="cards">Картки</option><option value="quiz">Тест</option><option value="list">Словник</option></select></label><label>Мова<select id="direction"><option value="uk">UA → JP</option><option value="jp">JP → UA</option></select></label><label>Слова<select id="filter"><option value="all">Усі</option><option value="review">На повторення</option><option value="new">Невивчені</option></select></label></div><div class="toggles"><label><input type="checkbox" id="romaji" checked> Romaji</label><label><input type="checkbox" id="pictures" checked> Підказки</label><button id="shuffle">⇄ Перемішати</button></div></section><section id="study" class="panel"><div class="stats"><strong id="heading"></strong><span id="position"></span></div><progress id="session" max="100" value="0"></progress><div id="content" aria-live="polite"></div><div id="nav" class="nav"><button id="prev">← Назад</button><button id="audio">🔊 Озвучити</button><button id="next">Далі →</button></div><p id="notice" role="status"></p></section><footer><span>Прогрес зберігається у цьому браузері.</span><span id="offline-status" role="status"></span><button id="reset">Скинути прогрес</button></footer></main><script>(()=>{const main=document.querySelector('main'),top=document.querySelector('.top-bar'),bottom=document.querySelector('.settings-bar');const layout=()=>{main.style.setProperty('--top-height',top.getBoundingClientRect().height+'px');main.style.setProperty('--bottom-height',bottom.getBoundingClientRect().height+'px')};layout();if('ResizeObserver' in window){const observer=new ResizeObserver(layout);observer.observe(top);observer.observe(bottom)}window.addEventListener('resize',layout)})();</script><script>if('serviceWorker' in navigator){window.addEventListener('load',async()=>{const status=document.getElementById('offline-status');try{await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});await navigator.serviceWorker.ready;status.textContent='✓ Готово до роботи без інтернету';}catch(e){status.textContent='Офлайн-кеш поки недоступний';}})}</script></body></html>
